<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한국전쟁 유엔 참전국 짝맞추기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        unblue: '#418fde',
                    },
                    fontFamily: {
                        sans: ['"Noto Sans KR"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f3f4f6; }
        .perspective { perspective: 1000px; }
        .preserve-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        
        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.4s ease-in-out;
            transform-style: preserve-3d;
        }
        
        .card.flipped .card-inner, .card.matched .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .card-front {
            background-color: #418fde;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M2 12h20"></path><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>');
            background-repeat: no-repeat;
            background-position: center;
            background-size: 50%;
        }

        .card-back {
            background-color: white;
            transform: rotateY(180deg);
            flex-direction: column;
            border: 2px solid #418fde;
        }

        /* 20장 카드를 위한 그리드 (모바일 4x5, 데스크톱 5x4) */
        .game-grid {
            display: grid;
            gap: 0.5rem;
            grid-template-columns: repeat(4, 1fr);
        }
        @media (min-width: 640px) {
            .game-grid { grid-template-columns: repeat(5, 1fr); }
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-gray-800 min-h-screen flex flex-col">

    <div id="app" class="flex-grow flex flex-col items-center justify-center w-full max-w-4xl mx-auto p-4 relative">
        
        <!-- 시작 화면 -->
        <div id="screen-main" class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8 text-center flex flex-col gap-6">
            <div class="mb-4">
                <div class="w-20 h-20 bg-unblue text-white rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M2 12h20"></path><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
                </div>
                <h1 class="text-2xl font-bold text-gray-900">한국전쟁<br>유엔 참전국 짝맞추기</h1>
                <p class="text-sm text-gray-500 mt-2">22개국 중 랜덤으로 등장하는 10개국의<br>짝을 빠르게 맞춰보세요!</p>
            </div>
            
            <button onclick="showScreen('screen-user-info')" class="w-full py-3 bg-unblue text-white font-bold rounded-lg hover:bg-blue-600 transition shadow-md text-lg">
                게임 시작
            </button>
            <button onclick="showRankingScreen()" class="w-full py-3 bg-gray-200 text-gray-800 font-bold rounded-lg hover:bg-gray-300 transition shadow-sm text-lg">
                순위 보기
            </button>
        </div>

        <!-- 정보 입력 화면 -->
        <div id="screen-user-info" class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8 hidden flex-col gap-4">
            <h2 class="text-xl font-bold text-center mb-2">참가자 정보 입력</h2>
            <div class="flex flex-col gap-2">
                <label class="text-sm font-semibold text-gray-600">이름</label>
                <input type="text" id="input-name" placeholder="홍길동" class="border border-gray-300 rounded-lg p-3 focus:outline-none focus:border-unblue focus:ring-1 focus:ring-unblue">
            </div>
            <div class="flex flex-col gap-2">
                <label class="text-sm font-semibold text-gray-600">학과</label>
                <input type="text" id="input-dept" placeholder="영어과" class="border border-gray-300 rounded-lg p-3 focus:outline-none focus:border-unblue focus:ring-1 focus:ring-unblue">
            </div>
            <div class="flex flex-col gap-2 mb-4">
                <label class="text-sm font-semibold text-gray-600">학번</label>
                <input type="text" id="input-student-id" placeholder="20260001" class="border border-gray-300 rounded-lg p-3 focus:outline-none focus:border-unblue focus:ring-1 focus:ring-unblue">
            </div>
            
            <p id="form-error" class="text-red-500 text-sm text-center hidden mb-2">모든 정보를 입력해주세요.</p>
            
            <div class="flex gap-2">
                <button onclick="showScreen('screen-main')" class="w-1/3 py-3 bg-gray-200 text-gray-800 font-bold rounded-lg hover:bg-gray-300 transition">
                    뒤로
                </button>
                <button onclick="startGame()" class="w-2/3 py-3 bg-unblue text-white font-bold rounded-lg hover:bg-blue-600 transition shadow-md">
                    시작하기
                </button>
            </div>
        </div>

        <!-- 게임 화면 -->
        <div id="screen-game" class="w-full h-full flex flex-col hidden pb-8 pt-4">
            <div class="flex justify-between items-center mb-6 bg-white p-4 rounded-xl shadow-sm">
                <div>
                    <p class="text-xs text-gray-500">참가자</p>
                    <p id="display-user-info" class="font-bold text-gray-800 text-sm">홍길동 (학과)</p>
                </div>
                <div class="text-right">
                    <p class="text-xs text-gray-500">플레이 타임</p>
                    <p id="timer-display" class="font-mono text-2xl font-bold text-unblue tracking-wider">00:00.00</p>
                </div>
            </div>
            
            <div id="game-board" class="game-grid w-full h-[60vh] md:h-[70vh]">
                <!-- 카드가 여기에 생성됩니다 -->
            </div>
            
            <div class="mt-6 text-center">
                 <button onclick="quitGame()" class="px-6 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition text-sm font-semibold">
                    게임 포기
                </button>
            </div>
        </div>

        <!-- 순위 화면 -->
        <div id="screen-ranking" class="w-full max-w-2xl bg-white rounded-2xl shadow-xl p-6 md:p-8 hidden flex-col max-h-[90vh]">
            <h2 class="text-2xl font-bold text-center mb-6 text-gray-900 flex items-center justify-center gap-2">
                🏆 명예의 전당
            </h2>
            
            <div class="overflow-y-auto flex-grow no-scrollbar mb-6 border rounded-lg">
                <table class="w-full text-sm text-left">
                    <thead class="text-xs text-gray-700 bg-gray-100 uppercase sticky top-0 z-10">
                        <tr>
                            <th scope="col" class="px-4 py-3 text-center w-12">순위</th>
                            <th scope="col" class="px-4 py-3">이름/학과/학번</th>
                            <th scope="col" class="px-4 py-3 text-right">기록</th>
                        </tr>
                    </thead>
                    <tbody id="ranking-list">
                        <tr><td colspan="3" class="px-4 py-8 text-center text-gray-500">데이터를 불러오는 중입니다...</td></tr>
                    </tbody>
                </table>
            </div>

            <button onclick="showScreen('screen-main')" class="w-full py-3 bg-gray-200 text-gray-800 font-bold rounded-lg hover:bg-gray-300 transition">
                메인으로 돌아가기
            </button>
        </div>

        <!-- 클리어 모달 -->
        <div id="modal-clear" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden opacity-0 transition-opacity duration-300">
            <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-sm w-full mx-4 text-center transform scale-95 transition-transform duration-300" id="modal-clear-content">
                <div class="text-5xl mb-4">🎉</div>
                <h3 class="text-2xl font-bold text-gray-900 mb-2">게임 클리어!</h3>
                <div class="bg-blue-50 text-unblue font-mono text-3xl font-bold py-4 rounded-xl mb-6 shadow-inner" id="modal-time">
                    00:00.00
                </div>
                <p class="text-xs text-gray-500 mb-6">기록이 서버에 저장되었습니다.</p>
                <button onclick="closeClearModal()" class="w-full py-3 bg-unblue text-white font-bold rounded-lg hover:bg-blue-600 transition shadow-md">
                    확인
                </button>
            </div>
        </div>
        
        <!-- 로딩 오버레이 -->
        <div id="loading-overlay" class="fixed inset-0 bg-white bg-opacity-80 flex items-center justify-center z-50 hidden">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-unblue"></div>
        </div>
    </div>

    <!-- Firebase SDK 및 게임 로직 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // 발급받은 Firebase 설정 적용
        const firebaseConfig = {
            apiKey: "AIzaSyCGnpMLYiob6KVCxyPzwz-URuMFbGCMx4s",
            authDomain: "un-korean-war-game.firebaseapp.com",
            projectId: "un-korean-war-game",
            storageBucket: "un-korean-war-game.firebasestorage.app",
            messagingSenderId: "731032405203",
            appId: "1:731032405203:web:7fb297459a7f9b33e34026",
            measurementId: "G-QV9FJN08D8"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        signInAnonymously(auth).catch((error) => {
            console.error("인증 실패:", error);
        });

        const nations = [
            { name: '미국', flag: '🇺🇸' }, { name: '영국', flag: '🇬🇧' },
            { name: '호주', flag: '🇦🇺' }, { name: '네덜란드', flag: '🇳🇱' },
            { name: '캐나다', flag: '🇨🇦' }, { name: '프랑스', flag: '🇫🇷' },
            { name: '뉴질랜드', flag: '🇳🇿' }, { name: '필리핀', flag: '🇵🇭' },
            { name: '남아공', flag: '🇿🇦' }, { name: '튀르키예', flag: '🇹🇷' },
            { name: '태국', flag: '🇹🇭' }, { name: '그리스', flag: '🇬🇷' },
            { name: '벨기에', flag: '🇧🇪' }, { name: '룩셈부르크', flag: '🇱🇺' },
            { name: '에티오피아', flag: '🇪🇹' }, { name: '콜롬비아', flag: '🇨🇴' },
            { name: '스웨덴', flag: '🇸🇪' }, { name: '인도', flag: '🇮🇳' },
            { name: '덴마크', flag: '🇩🇰' }, { name: '노르웨이', flag: '🇳🇴' },
            { name: '이탈리아', flag: '🇮🇹' }, { name: '독일', flag: '🇩🇪' }
        ];

        let firstCard = null, secondCard = null;
        let lockBoard = false, matchedPairs = 0;
        let startTime, timerInterval, elapsedMs = 0;
        let currentUser = { name: '', dept: '', studentId: '' };
        const targetPairs = 10;

        window.showScreen = (screenId) => {
            document.querySelectorAll('#app > div[id^="screen-"]').forEach(el => el.classList.add('hidden'));
            document.getElementById(screenId).classList.remove('hidden');
            document.getElementById(screenId).classList.add('flex');
        };

        function formatTime(ms) {
            const totalSeconds = Math.floor(ms / 1000);
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            const milliseconds = Math.floor((ms % 1000) / 10);
            return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}.${String(milliseconds).padStart(2, '0')}`;
        }

        window.startGame = () => {
            const name = document.getElementById('input-name').value.trim();
            const dept = document.getElementById('input-dept').value.trim();
            const sid = document.getElementById('input-student-id').value.trim();

            if (!name || !dept || !sid) {
                document.getElementById('form-error').classList.remove('hidden');
                return;
            }

            currentUser = { name, dept, studentId: sid };
            document.getElementById('display-user-info').innerText = `${name} (${dept} / ${sid})`;
            
            initGame();
            window.showScreen('screen-game');
            
            elapsedMs = 0;
            startTime = Date.now();
            document.getElementById('timer-display').innerText = "00:00.00";
            timerInterval = setInterval(() => {
                elapsedMs = Date.now() - startTime;
                document.getElementById('timer-display').innerText = formatTime(elapsedMs);
            }, 33);
        };

        window.quitGame = () => {
            clearInterval(timerInterval);
            window.showScreen('screen-main');
        };

        function initGame() {
            const board = document.getElementById('game-board');
            board.innerHTML = '';
            matchedPairs = 0;
            [firstCard, secondCard, lockBoard] = [null, null, false];

            // 전체 22개국 중 랜덤 10개국 추출
            let shuffledNations = [...nations].sort(() => 0.5 - Math.random());
            let selectedNations = shuffledNations.slice(0, targetPairs);

            // 10개국 * 2 = 20장 카드 생성
            let deck = [...selectedNations, ...selectedNations].sort(() => 0.5 - Math.random());

            deck.forEach((nation) => {
                const cardEl = document.createElement('div');
                cardEl.classList.add('card', 'perspective', 'cursor-pointer', 'w-full', 'h-full', 'min-h-[70px]', 'md:min-h-[90px]');
                cardEl.dataset.name = nation.name;

                cardEl.innerHTML = `
                    <div class="card-inner">
                        <div class="card-front"></div>
                        <div class="card-back">
                            <span class="text-4xl leading-none mb-1">${nation.flag}</span>
                            <span class="text-xs md:text-sm font-bold text-gray-800 text-center leading-tight tracking-tighter w-full px-1 truncate">${nation.name}</span>
                        </div>
                    </div>
                `;

                cardEl.addEventListener('click', () => {
                    if (lockBoard || cardEl === firstCard || cardEl.classList.contains('matched')) return;
                    cardEl.classList.add('flipped');
                    
                    if (!firstCard) {
                        firstCard = cardEl;
                        return;
                    }
                    
                    secondCard = cardEl;
                    lockBoard = true;
                    
                    if (firstCard.dataset.name === secondCard.dataset.name) {
                        firstCard.classList.add('matched');
                        secondCard.classList.add('matched');
                        matchedPairs++;
                        [firstCard, secondCard, lockBoard] = [null, null, false];
                        
                        if (matchedPairs === targetPairs) {
                            setTimeout(gameComplete, 500);
                        }
                    } else {
                        setTimeout(() => {
                            firstCard.classList.remove('flipped');
                            secondCard.classList.remove('flipped');
                            [firstCard, secondCard, lockBoard] = [null, null, false];
                        }, 800);
                    }
                });
                board.appendChild(cardEl);
            });
        }

        async function gameComplete() {
            clearInterval(timerInterval);
            const finalTimeStr = formatTime(elapsedMs);
            
            document.getElementById('modal-time').innerText = finalTimeStr;
            const modal = document.getElementById('modal-clear');
            const modalContent = document.getElementById('modal-clear-content');
            
            modal.classList.remove('hidden');
            void modal.offsetWidth; 
            modal.classList.remove('opacity-0');
            modalContent.classList.remove('scale-95');

            try {
                await addDoc(collection(db, 'rankings'), {
                    name: currentUser.name,
                    department: currentUser.dept,
                    studentId: currentUser.studentId,
                    time: elapsedMs,
                    formattedTime: finalTimeStr,
                    timestamp: serverTimestamp()
                });
            } catch (e) {
                console.error("저장 실패:", e);
            }
        }

        window.closeClearModal = () => {
            const modal = document.getElementById('modal-clear');
            modal.classList.add('opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
                window.showScreen('screen-main');
            }, 300);
        };

        window.showRankingScreen = async () => {
            window.showScreen('screen-ranking');
            const tbody = document.getElementById('ranking-list');
            document.getElementById('loading-overlay').classList.remove('hidden');
            tbody.innerHTML = '';

            try {
                const querySnapshot = await getDocs(collection(db, 'rankings'));
                let records = [];
                querySnapshot.forEach((doc) => records.push(doc.data()));
                records.sort((a, b) => a.time - b.time);

                if (records.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="3" class="px-4 py-8 text-center text-gray-500">아직 등록된 기록이 없습니다.</td></tr>`;
                } else {
                    records.slice(0, 50).forEach((record, index) => {
                        const tr = document.createElement('tr');
                        tr.className = index < 3 ? 'bg-blue-50 border-b' : 'bg-white border-b';
                        
                        let rankDisplay = `${index + 1}`;
                        if (index === 0) rankDisplay = '🥇 1';
                        if (index === 1) rankDisplay = '🥈 2';
                        if (index === 2) rankDisplay = '🥉 3';

                        tr.innerHTML = `
                            <td class="px-4 py-3 text-center font-bold text-gray-700">${rankDisplay}</td>
                            <td class="px-4 py-3 font-medium text-gray-900">${record.name} / ${record.department} / ${record.studentId}</td>
                            <td class="px-4 py-3 text-right font-mono text-unblue font-bold">${record.formattedTime}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                }
            } catch (error) {
                console.error("랭킹 불러오기 실패:", error);
                tbody.innerHTML = `<tr><td colspan="3" class="px-4 py-8 text-center text-red-500">데이터를 불러오는 중 오류가 발생했습니다.</td></tr>`;
            } finally {
                document.getElementById('loading-overlay').classList.add('hidden');
            }
        };
    </script>
</body>
</html>
